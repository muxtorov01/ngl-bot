services:
  - type: web
    name: ngl-bot
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SUPER_ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ngl-bot-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_MSG_PER_WINDOW
        value: "3"
      - key: ANTISPAM_WINDOW_SECONDS
        value: "30"
      - key: MAX_VOICE_SECONDS
        value: "60"
      - key: MAX_VOICE_BYTES
        value: "2097152"
      - key: MAX_PHOTO_BYTES
        value: "10485760"

databases:
  - name: ngl-bot-db
    plan: starter
    region: oregon
